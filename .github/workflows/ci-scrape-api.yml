name: Scrape json Data

on:
  push:
    branches-ignore: ["data"]
    paths-ignore:
      - '**.json'
  schedule: # Ref https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '0 */2 * * *' # Ref https://crontab.guru/examples.html

env:
  BRANCH_SAVE: data
  PATHWAY_SAVE: roi/
  TIMEZONE: Europe/Moscow

jobs:
  server_status:
    name: Check if scrape is needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_scrape: ${{ steps.health.outputs.should_scrape }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 200
          ref: ${{ github.ref }}

      - name: Health check server
        id: health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.roi.ru/api/attributes/status.json)
          if [ "$STATUS" != "200" ]; then
            echo "Health check is failed"
            exit 1
          fi
          echo "It's OK"
          echo "should_scrape=true" >> $GITHUB_OUTPUT

  deploy_and_scrape:
    name: Scrape and Push to 'data' branch
    runs-on: ubuntu-latest
    needs: server_status
    if: needs.server_status.outputs.should_scrape == 'true'
    permissions: # Ref https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
      contents: write
    steps:
      # 1. Checkout 'master' branch to get scripts and package.json
      - name: Checkout 'master' branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history to access 'data' branch
          ref: master

      # 2. Install dependencies while in 'master' (package.json is available)
      - name: Install dependencies
        run: npm install

      # 3. Switch to 'data' branch & sync
      - name: Switch to 'data' & sync
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # Check if 'data' branch exists on remote
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH_SAVE; then
            echo "Branch '$BRANCH_SAVE' exists. Checking out..."
            # Create local branch tracking remote branch
            git checkout -b $BRANCH_SAVE origin/$BRANCH_SAVE
            # Sync with remote to get latest data
            git pull origin $BRANCH_SAVE --no-rebase
          else
            echo "Branch '$BRANCH_SAVE' does not exist. Creating orphan branch..."
            # Create a new orphan branch (no history)
            git checkout --orphan $BRANCH_SAVE
            # Clear the working directory and index (since orphan branch inherits files from 'master')
            git rm -rf .
          fi

      # 4. CRITICAL FIX: Restore package.json from 'master'
      # The 'data' branch does not have package.json. 
      # We copy it from 'master' so that 'npm run' can find the script definitions.
      - name: Restore package.json and **/*.js for script execution
        run: |
          git checkout master -- .gitignore json-data-roi.js package.json

      # 5. Run scrape script
      # Now package.json is present in the working directory, so npm can run the script.
      # The script will generate/update JSON files in 'data' folder.
      - name: Run scrape script
        run: npm run update-roi
        env:
          PATHWAY_SAVE: ${{ env.PATHWAY_SAVE }}
          TIMEZONE: ${{ env.TIMEZONE }} # Optional

      - name: Decide if scrape is needed
        id: decide
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Triggered by schedule. Scraping..."
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"
            
            if [ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]; then
              echo "First commit. Scraping..."
              echo "should_scrape=true" >> $GITHUB_OUTPUT
            else
              CHANGED_NON_JSON=$(git diff --name-only ${BEFORE_SHA} ${CURRENT_SHA} | grep -v '\.json$' | xargs)
              if [ -n "$CHANGED_NON_JSON" ]; then
                echo "Non-JSON files changed: $CHANGED_NON_JSON. Scraping..."
                echo "should_scrape=true" >> $GITHUB_OUTPUT
              else
                echo "Only JSON or no files changed. Skipping scrape."
                echo "should_scrape=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "should_scrape=false" >> $GITHUB_OUTPUT
          fi

      # 6. Commit and Push changes to 'data' branch
      - name: Commit and Push changes to 'data'
        run: |
          # Remove package.json and **/*.js from the index
          # to ensure they are NOT committed to the 'data' branch.
          git rm -f .gitignore json-data-roi.js package.json || true
          
          # Add only the JSON data files (from 'data' folder)
          git add $PATHWAY_SAVE
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes in '$PATHWAY_SAVE' folder to commit. Skipping push."
            exit 0
          fi
          
          git commit -m "Auto-update json files [skip ci]: ${{ github.sha }}"
          git push origin $BRANCH_SAVE
          echo "Successfully pushed updates to '$BRANCH_SAVE' branch."
